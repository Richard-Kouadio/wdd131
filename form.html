<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A product review form created for WDD 131 where users can rate products, provide installation details, and share helpful feedback.">

    <meta name="author" content="Kouame Richard Kouadio">

    <title>Product Review Form | WDD 131 | Kouame Richard Kouadio</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>

</head>


<body>


    <header>

        <h1>
            Product Review Form
        </h1>

    </header>



    <main>


        <form method="get" action="review.html">


            <label for="product">
                Product Name <span class="required">*</span>
            </label>


            <select id="product" name="product" required>

                <option value="" disabled selected>
                    Select a Product ...
                </option>

            </select>




            <fieldset>

                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>


                <div class="rating">


                    <label>
                        ☆
                        <input type="radio" name="rating" value="1" required>
                    </label>


                    <label>
                        ☆☆
                        <input type="radio" name="rating" value="2">
                    </label>


                    <label>
                        ☆☆☆
                        <input type="radio" name="rating" value="3">
                    </label>


                    <label>
                        ☆☆☆☆
                        <input type="radio" name="rating" value="4">
                    </label>


                    <label>
                        ☆☆☆☆☆
                        <input type="radio" name="rating" value="5">
                    </label>


                </div>

            </fieldset>




            <label for="date">
                Date of Installation <span class="required">*</span>
            </label>


            <input type="date" id="date" name="date" required>




            <fieldset>


                <legend>
                    Useful Features
                </legend>



                <label>
                    <input type="checkbox" name="features" value="Durability">
                    Durability
                </label>


                <label>
                    <input type="checkbox" name="features" value="Ease of Use">
                    Ease of Use
                </label>


                <label>
                    <input type="checkbox" name="features" value="Performance">
                    Performance
                </label>


                <label>
                    <input type="checkbox" name="features" value="Design">
                    Design
                </label>



            </fieldset>





            <label for="review">
                Written Review <span class="optional">(Optional)</span>
            </label>


            <textarea id="review" name="review">
</textarea>





            <label for="username">
                Your Name <span class="optional">(Optional)</span>
            </label>


            <input type="text" id="username" name="username" autocomplete="name">





            <input type="submit" value="Submit Review">



        </form>


    </main>




    <footer>

        <p>
            © 2026 Kouame Richard Kouadio | Côte d'Ivoire
        </p>

    </footer>



</body>

</html>
